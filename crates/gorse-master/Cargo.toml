[package]
name = "gorse-master"
description = "Rust port of the Gorse Go package `master`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
cookie = { workspace = true, features = ["private"] }
futures-core.workspace = true
futures-util.workspace = true
gorse-common = { workspace = true }
gorse-protocol = { workspace = true }
gorse-config = { workspace = true }
gorse-dataset = { workspace = true }
gorse-logics = { workspace = true }
gorse-model-core = { workspace = true }
gorse-model = { workspace = true }
gorse-storage-core = { workspace = true }
# Every backend the Go master can open: `data.Open`, `cache.Open`, `vectors.Open`
# and `blob.NewStore` take all of them.
gorse-storage = { workspace = true, features = ["mysql", "postgres", "sqlite", "mongodb", "redis", "qdrant", "milvus", "weaviate", "s3", "gcs", "azure"] }
gorse-server = { workspace = true }
gorse-worker = { workspace = true }
minijinja.workspace = true
moka.workspace = true
notify.workspace = true
openidconnect.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
rust-embed = { workspace = true, features = ["debug-embed", "include-exclude"] }
prometheus = { workspace = true, features = ["process"] }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
hyper-rustls.workspace = true
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "gorse-storage"
description = "Rust port of the Gorse Go package `storage/{data,cache,vectors,blob,meta}`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-protocol = { workspace = true }
gorse-storage-core = { workspace = true }
gorse-config = { workspace = true }
gorse-model-core = { workspace = true }
indexmap.workspace = true
serde.workspace = true
# `raw_value` writes a `json.Number`'s text as it is, as Go's `json.Marshal` does.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
async-trait.workspace = true
# The SQL drivers are optional, one feature each (D-18). `sqlx` serves MySQL and
# Postgres; `rusqlite` serves SQLite, on `tokio`'s blocking pool.
rusqlite = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }

[features]
mysql = ["dep:sqlx", "sqlx/mysql"]
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:rusqlite", "dep:tokio"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

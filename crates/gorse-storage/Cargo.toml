[package]
name = "gorse-storage"
description = "Rust port of the Gorse Go package `storage/{data,cache,vectors,blob,meta}`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-protocol = { workspace = true }
gorse-storage-core = { workspace = true }
gorse-config = { workspace = true }
gorse-model-core = { workspace = true }
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
prost-types = { workspace = true }
serde.workspace = true
# `raw_value` writes a `json.Number`'s text as it is, as Go's `json.Marshal` does.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror.workspace = true
tonic = { workspace = true }
tracing.workspace = true
async-trait.workspace = true
# The blob stores are async (decision D-122). POSIX file calls run through
# `tokio::fs`, which uses the blocking pool.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "net", "fs", "io-util", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
url = "2.5.8"
percent-encoding = "2.3.2"
bytes = { version = "1.12.1", optional = true }
# Cloud stores, one feature per provider (`storage/blob/{s3,gcs,azure}.go`).
object_store = { version = "0.14.2", default-features = false, optional = true }

# The MongoDB driver, for `cache::mongodb`. Optional, so a build that needs no
# MongoDB store does not link it.
mongodb = { workspace = true, optional = true }
# The SQL drivers, for `data::sql` (`storage/data/sql.go`). Optional, one
# feature per dialect. Only the runtime and TLS are chosen here; the queries are
# plain SQL text, so no `macros` feature is needed.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring"], optional = true }
# The SQLite SDK, for `data::sql::sqlite`, which registers `json_contains` through
# the C API because sqlx-sqlite has no scalar function API. It is the copy
# sqlx-sqlite links, so there is one SQLite in the build.
libsqlite3-sys = { version = "0.37.0", optional = true }
# The cursors of the SQL store are base64 text (`storage/data/sql.go`).
base64 = "0.23.1"

[features]
s3 = ["dep:object_store", "dep:bytes", "object_store/aws"]
gcs = ["dep:object_store", "dep:bytes", "object_store/gcp"]
azure = ["dep:object_store", "dep:bytes", "object_store/azure"]
mongodb = ["dep:mongodb"]
mysql = ["dep:sqlx", "sqlx/mysql"]
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:libsqlite3-sys"]

[dev-dependencies]
hex.workspace = true
# Seeds the GCS emulator through its JSON upload API in `gcs::tests`.
reqwest = { workspace = true }

[lints]
workspace = true

[package]
name = "gorse-storage"
description = "Rust port of the Gorse Go package `storage/{data,cache,vectors,blob,meta}`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-protocol = { workspace = true }
gorse-storage-core = { workspace = true }
gorse-config = { workspace = true }
gorse-model-core = { workspace = true }
indexmap.workspace = true
serde.workspace = true
# `raw_value` writes a `json.Number`'s text as it is, as Go's `json.Marshal` does.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
async-trait.workspace = true
# The Redis cache store (`cache::redis`). Off by default, as Go's Redis
# driver is only linked in when a `redis://` store is configured.
redis = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# `OnceCell` opens the Redis connection on first use, since Go's creators do not
# connect until a call is made and Creators here are not async.
tokio = { workspace = true, optional = true, features = ["sync"] }

[features]
redis = ["dep:redis", "dep:base64", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

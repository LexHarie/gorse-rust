[package]
name = "gorse-storage"
description = "Rust port of the Gorse Go package `storage/{data,cache,vectors,blob,meta}`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-protocol = { workspace = true }
gorse-storage-core = { workspace = true }
gorse-config = { workspace = true }
gorse-model-core = { workspace = true }
indexmap.workspace = true
prost-types = { workspace = true }
serde.workspace = true
# `raw_value` writes a `json.Number`'s text as it is, as Go's `json.Marshal` does.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror.workspace = true
tonic = { workspace = true }
tracing = { workspace = true }
# The gRPC master store runs its async client and server on a tokio runtime
# behind the blocking `Store` trait (Go's `Store` is synchronous).
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
url = "2.5.8"
percent-encoding = "2.3.2"
bytes = { version = "1.12.1", optional = true }
# Cloud stores, one feature per provider (`storage/blob/{s3,gcs,azure}.go`).
object_store = { version = "0.14.2", default-features = false, optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }

[features]
s3 = ["dep:object_store", "dep:futures-util", "dep:bytes", "object_store/aws"]
gcs = ["dep:object_store", "dep:futures-util", "dep:bytes", "object_store/gcp"]
azure = ["dep:object_store", "dep:futures-util", "dep:bytes", "object_store/azure"]

[dev-dependencies]
tempfile = { workspace = true }
# Seeds the GCS emulator through its JSON upload API in `gcs::tests`.
reqwest = { workspace = true }

[lints]
workspace = true

[package]
name = "gorse-worker"
description = "Rust port of the Gorse Go package `worker`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
gorse-common = { workspace = true }
gorse-protocol = { workspace = true }
gorse-config = { workspace = true }
gorse-logics = { workspace = true }
gorse-model = { workspace = true }
gorse-model-core = { workspace = true }
# Every backend the Go worker can open: `data.Open`, `cache.Open`, `vectors.Open`
# and `blob.NewStore` take all of them.
gorse-storage = { workspace = true, features = ["mysql", "postgres", "sqlite", "mongodb", "redis", "qdrant", "milvus", "weaviate", "s3", "gcs", "azure"] }
hex.workspace = true
md-5.workspace = true
prometheus = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
gorse-dataset.workspace = true
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true

[package]
name = "gorse-logics"
description = "Rust port of the Gorse Go package `logics`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-config = { workspace = true }
gorse-dataset = { workspace = true }
gorse-storage-core = { workspace = true }
gorse-storage = { workspace = true }
# The vector writer holds its lock across the store's awaits, as Go holds
# `mu` across the store's calls.
tokio = { workspace = true, features = ["sync"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Reads the Go-generated golden `testdata/sparse_oracle.json`.
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

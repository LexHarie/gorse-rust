[package]
name = "gorse-conformance"
description = "Differential tests that run the same inputs through the Go and Rust builds of Gorse."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-config = { workspace = true }
gorse-logics = { workspace = true }
gorse-storage = { workspace = true, features = ["mysql", "postgres", "sqlite", "mongodb", "redis"] }
indexmap.workspace = true
mongodb.workspace = true
redis.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["mysql", "postgres"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true

[package]
name = "gorse-conformance"
description = "Differential tests that run the same inputs through the Go and Rust builds of Gorse."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The mixed-master REST test serves the Rust master's router over HTTP (cluster.rs).
axum.workspace = true
gorse-common = { workspace = true }
gorse-config = { workspace = true }
gorse-logics = { workspace = true }
# The mixed-cluster harness (cluster.rs) runs the Rust master and worker in process.
gorse-master = { workspace = true }
gorse-worker = { workspace = true }
gorse-storage = { workspace = true, features = ["mysql", "postgres", "sqlite", "mongodb", "redis"] }
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
# The mixed-cluster harness writes the certificates of a TLS run (cluster.rs).
rcgen.workspace = true
mongodb.workspace = true
redis.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["mysql", "postgres"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic.workspace = true
# The mixed-cluster harness keeps the Rust worker's log lines for its failures (cluster.rs).
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The mixed-master REST test sends the ranker prompt's templates in base64 (tests/mixed_master_rest.rs).
base64.workspace = true
serde = { workspace = true }
# The vector cross-read (tests/vector_cross_read.rs) drives the Rust vector stores
# for all three backends.
gorse-common = { workspace = true }
# The item-to-item oracle (tests/item_to_item_oracle.rs) builds the processed labels.
gorse-dataset = { workspace = true }
gorse-storage = { workspace = true, features = ["qdrant", "milvus", "weaviate"] }
gorse-storage-core = { workspace = true }
# The mixed-server test (tests/mixed_server.rs) runs the Rust server against the Go nodes.
gorse-server = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

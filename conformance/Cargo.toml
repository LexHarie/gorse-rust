[package]
name = "gorse-conformance"
description = "Differential tests that run the same inputs through the Go and Rust builds of Gorse."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gorse-common = { workspace = true }
gorse-storage = { workspace = true, features = ["mysql", "postgres", "sqlite"] }
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic.workspace = true

[lints]
workspace = true

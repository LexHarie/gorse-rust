# The Lean project of the verification plan. It builds proofs/ on the pinned toolchain
# and Mathlib, then runs the G1 checks (scripts/check-proofs.sh, P1-2), the statement
# freeze (G4, scripts/check-statements.sh) and the independent kernels (G2,
# scripts/check-kernels.sh, P1-5).
name: proofs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the runs still going for the previous push.
# Runs for pushes to a branch, and manual runs, always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  g1:
    name: Lean build and G1 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The full history, so the base commit of the pull request can be read (G4).
          fetch-depth: 0
          persist-credentials: false

      - name: Install elan, the Lean toolchain manager
        run: |
          curl -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          # The installer's digest, recorded from the first run (2026-11-05). A changed
          # installer fails here, before it runs.
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the prebuilt Mathlib modules
        # Mathlib's cache holds the compiled modules for the pinned revision in
        # lake-manifest.json. Without it, the build compiles every Mathlib module the
        # project imports, which ran past 15 minutes for the T1 spec.
        working-directory: proofs
        run: lake exe cache get

      - name: Build the Lean project
        working-directory: proofs
        run: |
          lake build
          {
            echo "### Pins recorded by the proofs job"
            echo "- lean-toolchain: \`$(cat lean-toolchain)\`"
            echo "- lean binary sha256: \`$(sha256sum "$(elan which lean)" | cut -d' ' -f1)\`"
            echo "- lake-manifest.json sha256: \`$(sha256sum lake-manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the build kept the committed manifest
        run: git diff --exit-code -- proofs/lake-manifest.json

      - name: Check that the scan catches a planted sorry
        run: scripts/check-proofs.sh --self-test

      - name: Run the G1 checks
        run: scripts/check-proofs.sh

      - name: Check that the statement scan catches a changed statement (G4)
        run: scripts/check-statements.sh --self-test

      - name: Check the statement freeze (G4)
        env:
          # The base rule applies to pull requests: it compares the manifest with the
          # pull request's base commit. A workflow_dispatch run has no base, so it runs
          # the plain check, which still checks every statement against the manifest.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            scripts/check-statements.sh --base "$BASE_SHA"
          else
            scripts/check-statements.sh
          fi

      - name: Check that the ndcg log table's Lean file is the generated file (D-354)
        # scripts/gen-log2-table/gen.py writes proofs/Gorse/Spec/Log2Table.lean from the table of
        # LOG2_TABLE in the Rust source, and --check fails when the committed file differs.
        run: python3 scripts/gen-log2-table/gen.py --check

      - name: Run the independent kernels on the proofs (G2)
        timeout-minutes: 60
        run: scripts/check-kernels.sh

      - name: Check the fusion of the dot kernels (D-344, D-345, D-346, D-347)
        # scripts/check-disasm.sh compiles the three dot kernels with clang and the build.rs
        # flags, and checks the fused operations each model assumes.
        run: |
          command -v clang >/dev/null || sudo apt-get install -y clang
          scripts/check-disasm.sh

  g9:
    name: Lean oracle for the T1 metrics (G9)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install elan, the Lean toolchain manager
        run: |
          curl -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          # The installer's digest, as recorded by the g1 job above.
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the oracle executable
        # The oracle imports only Lean's own library, so this does not build Mathlib.
        working-directory: proofs
        run: lake build oracle

      - name: Check the T1 metrics against the oracle (G9)
        run: scripts/check-oracle.sh "$RUNNER_TEMP/g9"

      - name: Check the top-k filter against the oracle (G9, D-335)
        # The oracle_topk executable imports the computable mirror only, which is Lean's core
        # library, so this build does not build Mathlib either.
        run: scripts/check-oracle-topk.sh "$RUNNER_TEMP/g9-topk"

      - name: Fetch the Mathlib cache for the dot oracle (D-349)
        # oracle_dot imports Gorse.Spec.DotRat, which imports Mathlib (D-340). This is the fetch
        # the g1 job does, so the build below does not compile Mathlib from source.
        working-directory: proofs
        run: lake exe cache get

      - name: Build the dot oracle and smoke-test it (D-349)
        # The computability test of D-349: the executable must build, and it must print the
        # two expected lines. 8388608 -23 is 1.0 and 1 -149 is the least subnormal.
        working-directory: proofs
        run: |
          lake build oracle_dot
          printf '%s\n' \
            '{"model":"seq","xs":[[1,0]],"ys":[[1,0]]}' \
            '{"model":"seq","xs":[[1,-149]],"ys":[[1,0]]}' \
            | .lake/build/bin/oracle_dot > "$RUNNER_TEMP/dot-smoke.txt"
          printf '8388608 -23\n1 -149\n' | cmp - "$RUNNER_TEMP/dot-smoke.txt"

      - name: List the trust base of the dot oracle (D-349)
        # Prints each implemented_by, extern and csimp target reached from main, the root of oracle_dot. The
        # file is in scripts/, not in proofs/, because the G1 step 1 scan forbids those names in
        # every proof source, and this file only lists them.
        working-directory: proofs
        run: lake env lean ../scripts/dot-trust.lean

      - name: Check the dot kernels seq and avx against the oracle (G9, D-349)
        # The Rust kernels run at the levels the runner's CPU has, and the oracle runs in chunks.
        # The avx512 model is checked by the g9-avx512 job, on the cases and the oracle output that
        # this job uploads, so this runner may lack AVX-512 (D-351, P4-10).
        env:
          G9_DOT_MODELS: seq,avx
        run: scripts/check-oracle-dot.sh "$RUNNER_TEMP/g9-dot"

      - name: Upload the dot cases and the oracle output for the g9-avx512 job (D-351, P4-10)
        uses: actions/upload-artifact@v4
        with:
          name: g9-dot-results
          path: ${{ runner.temp }}/g9-dot/
          retention-days: 1

      - name: Check map against the oracle (G9, D-352)
        # The Rust map and the Lean twin Gorse.Spec.MapRat.mapQ on 100,000 seeded cases, in chunks of
        # 1,000 lines. The oracle builds with Mathlib from the cache, as the dot oracle does.
        run: scripts/check-oracle-map.sh "$RUNNER_TEMP/g9-map"

      - name: List the trust base of the map oracle (D-352)
        # Prints each implemented_by, extern and csimp target reached from main, the root of oracle_map.
        # The file is in scripts/, not in proofs/, because the G1 step 1 scan forbids those names in
        # every proof source, and this file only lists them.
        working-directory: proofs
        run: lake env lean ../scripts/map-trust.lean

      - name: Check ndcg against the oracle (G9, D-356)
        # The Rust ndcg and the Lean twin Gorse.Spec.NdcgRat.ndcgQ on 100,000 seeded cases, in chunks of
        # 1,000 lines. The oracle builds with Mathlib from the cache, as the map oracle does.
        run: scripts/check-oracle-ndcg.sh "$RUNNER_TEMP/g9-ndcg"

      - name: List the trust base of the ndcg oracle (D-356)
        # Prints each implemented_by, extern and csimp target reached from main, the root of oracle_ndcg.
        # The file is in scripts/, not in proofs/, because the G1 step 1 scan forbids those names in
        # every proof source, and this file only lists them.
        working-directory: proofs
        run: lake env lean ../scripts/ndcg-trust.lean

      - name: Check the ndcg log table against the oracle (G9, D-354)
        # The table LOG2_TABLE of the ndcg evaluator, for k = 2..65, against the oracle_log2 executable
        # of the core library. Its build does not compile Mathlib.
        run: scripts/check-oracle-log2.sh "$RUNNER_TEMP/g9-log2"

      - name: List the trust base of the log2 oracle (D-354)
        # Prints each implemented_by, extern and csimp target reached from main, the root of oracle_log2.
        # The file is in scripts/, not in proofs/, because the G1 step 1 scan forbids those names in
        # every proof source, and this file only lists them.
        working-directory: proofs
        run: lake env lean ../scripts/log2-trust.lean

  g9-avx512:
    name: The AVX-512 dot kernel against the oracle (G9, D-351)
    # The AVX-512 steps of the g9 job, split out (the P4-10 ruling). A runner without AVX-512 costs a
    # re-run of this job alone. It compares the cases and the oracle output that the g9 job uploads,
    # so it needs no Lean toolchain and does not rebuild the oracle. The hard fail stays: a runner
    # without AVX-512 fails the check, as D-351 requires. The emulated mode (Intel SDE) is pending a
    # license decision and is not in this job.
    needs: g9
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the dot cases and the oracle output from the g9 job
        uses: actions/download-artifact@v4
        with:
          name: g9-dot-results
          path: ${{ runner.temp }}/g9-dot

      - name: Build the dot example
        run: cargo build --release -q -p gorse-model --example g9_dot

      - name: Check the avx512 model against the oracle (G9, D-349)
        # The avx512 model on the cases of the g9 job. The check fails when this runner has no
        # AVX-512 (D-351), and then the job reports the failure in its log.
        run: |
          target/release/examples/g9_dot check \
            "$RUNNER_TEMP/g9-dot/cases.jsonl" "$RUNNER_TEMP/g9-dot/results.txt" avx512

      - name: Check that the AVX-512 kernel lies within the bound of dot_levels_close (P4-8, D-351)
        # The AVX-512 kernel and the scalar loop must agree within the bound of the Lean theorem
        # Gorse.Spec.DotLevels.dot_levels_close, on the pairs of the dot check above. The check fails
        # on a CPU without AVX-512, so it cannot pass silently.
        run: target/release/examples/g9_dot levels 4000

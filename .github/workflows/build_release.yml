name: release

on:
  release:
    types: [published]

jobs:
  docker_images:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - name: Pull source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: get_version
        uses: battila7/get-version-action@v2

      - if: github.event.release.prerelease == false
        name: Build Docker image
        uses: docker/bake-action@v6
        with:
          source: .
          targets: default
          push: true
        env:
          VERSIONS: latest,${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }},${{ steps.get_version.outputs.version-without-v }}

      - if: github.event.release.prerelease == true
        name: Build prerelease Docker image
        uses: docker/bake-action@v6
        with:
          source: .
          targets: default
          push: true
        env:
          VERSIONS: ${{ steps.get_version.outputs.version-without-v }}


# G10, cargo-mutants on the verified T1 metric code (scripts/check-mutants.sh, D-327).
name: mutants

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the runs still going for the previous push.
# Runs for pushes to a branch, and manual runs, always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  g10:
    name: cargo-mutants on the T1 metrics (G10)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install cargo-mutants
        # Pinned, so a new release cannot change which mutants are generated.
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Run the mutants on the T1 metrics
        run: scripts/check-mutants.sh "$RUNNER_TEMP/mutants"

      - name: Run the mutants on the top-k code of heap.rs (G10, D-336)
        run: scripts/check-mutants-topk.sh "$RUNNER_TEMP/mutants-topk"

  # Measurement for D-327 (dispatch only, scratch branch): the gorse-model mutant count
  # and the time of one unmutated lib run, to size the sharded crate baseline.
  measure:
    name: count the gorse-model mutants and time its lib suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install cargo-mutants
        # Pinned, as in mutants.yml, so the mutants generated are the same.
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Count the mutants of gorse-model
        run: |
          cargo mutants --package gorse-model --list > "$RUNNER_TEMP/mutants-list.txt"
          echo "mutants listed: $(grep -c . "$RUNNER_TEMP/mutants-list.txt")"
          echo "--- by file:"
          sed -E 's/:[0-9]+:.*//' "$RUNNER_TEMP/mutants-list.txt" | sort | uniq -c | sort -rn | head -40

      - name: Build the gorse-model lib tests
        run: cargo test -p gorse-model --lib --no-run

      - name: Time one unmutated run of the gorse-model lib suite
        run: |
          start=$(date +%s)
          status=0
          cargo test -p gorse-model --lib > "$RUNNER_TEMP/baseline.log" 2>&1 || status=$?
          echo "baseline exit=$status seconds=$(( $(date +%s) - start ))"
          grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/baseline.log" | head -20
          exit "$status"

  # Per-module timing for D-327 (dispatch only, scratch branch): one unmutated run of each
  # module's test set, to size the first pass of the sharded crate baseline.
  modules:
    name: time the unmutated module test sets
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build the gorse-model lib tests
        run: cargo test -p gorse-model --lib --no-run

      - name: Time one unmutated run of each module's tests
        run: |
          for m in cf ctr tpe; do
            start=$(date +%s)
            status=0
            cargo test -p gorse-model --lib "$m::" > "$RUNNER_TEMP/$m.log" 2>&1 || status=$?
            echo "module $m exit=$status seconds=$(( $(date +%s) - start ))"
            grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/$m.log" | head -5
          done

# D-327, the crate-level cargo-mutants baseline of gorse-model (the President's ruling of
# 2026-11-08, option (a)). Scratch-branch run, dispatched by hand only.
#
# First pass: each mutant runs its module's tests (cf::, ctr::, tpe::), and the mutants of a
# module are split with --shard k/n: cf 10 shards, ctr 10, tpe 2.
# Second pass: every mutant the first pass missed or timed out is re-run against the full
# lib suite with no test filter. The re-run must select exactly those mutants.
name: mutants

on:
  workflow_dispatch:
    inputs:
      only:
        description: "First-pass shards to run, as module:shard,... (for example ctr:3,ctr:5). Empty runs them all, and the survivor re-run runs only then."
        type: string
        default: ""
      survivors_from:
        description: "Survivor re-run only: run ids (comma-separated) whose first-pass artifacts are re-run. Set only to none:0 with it, so no first-pass shard runs."
        type: string
        default: ""
      skip_artifacts:
        description: "Survivor re-run only: first-pass artifact names (comma-separated, for example first-pass-cf-5,first-pass-ctr-3) to leave out of the re-run, because another dispatch measured those shards."
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  first-pass:
    name: first pass ${{ matrix.module }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 0 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 1 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 2 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 3 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 4 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 5 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 6 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 7 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 8 }
          - { module: cf, glob: "crates/gorse-model/src/cf/**", filter: "cf::", total: 10, shard: 9 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 0 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 1 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 2 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 3 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 4 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 5 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 6 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 7 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 8 }
          - { module: ctr, glob: "crates/gorse-model/src/ctr/**", filter: "ctr::", total: 10, shard: 9 }
          - { module: tpe, glob: "crates/gorse-model/src/tpe{.rs,/**}", filter: "tpe::", total: 2, shard: 0 }
          - { module: tpe, glob: "crates/gorse-model/src/tpe{.rs,/**}", filter: "tpe::", total: 2, shard: 1 }
    steps:
      - name: Check out the repository
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Place the frappe dataset the ctr tests read (D-327)
        # The ctr baseline loads frappe (ctr::data::tests::load_data_from_built_in_frappe). Without
        # this step the shard's unmutated baseline fails, so no mutant in it is measured.
        if: ${{ ( inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard))) && matrix.module == 'ctr' }}
        timeout-minutes: 15
        run: GORSE_DATASETS=frappe scripts/setup-datasets.sh

      - name: Install cargo-mutants
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        # Pinned, as in the existing G10 job, so the mutants generated are the same.
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Run this shard's mutants against the module's tests
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        env:
          GLOB: ${{ matrix.glob }}
          FILTER: ${{ matrix.filter }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          status=0
          cargo mutants --package gorse-model --file "$GLOB" --shard "$SHARD" --output "$out" -- --lib "$FILTER" || status=$?
          echo "cargo-mutants exit=$status"
          # 0: all caught. 2: some missed. 3: some timed out. These outcomes are the record, so
          # the shard keeps them and the second pass re-runs them. Any other status is a failure.
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac

      - name: Upload this shard's outcomes
        if: ${{ always() && (inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard))) }}
        uses: actions/upload-artifact@v4
        with:
          name: first-pass-${{ matrix.module }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  # Split first pass for cf shards 5 and 6 of 10, which reached the 360-minute job limit in the
  # full run (D-327). Each shard is listed with the same --shard the first pass used, then cut into
  # `parts` pieces with split -n l/part/parts. A part's regex must select exactly the part's lines
  # before the part runs, so the four parts of a shard cover exactly that shard's mutants.
  first-pass-split:
    name: first pass ${{ matrix.module }} ${{ matrix.shard }}/10, part ${{ matrix.part }} of ${{ matrix.parts }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 5, part: 1, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 5, part: 2, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 5, part: 3, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 5, part: 4, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 6, part: 1, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 6, part: 2, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 6, part: 3, parts: 4 }
          - { module: cf-split, glob: "crates/gorse-model/src/cf/**", filter: "cf::", shard: 6, part: 4, parts: 4 }
    steps:
      - name: Check out the repository
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install cargo-mutants
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Select this part of the shard
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        env:
          GLOB: ${{ matrix.glob }}
          SHARD: ${{ matrix.shard }}/10
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
        run: |
          cargo mutants --package gorse-model --file "$GLOB" --shard "$SHARD" --list > "$RUNNER_TEMP/shard.txt"
          split -n "l/$PART/$PARTS" "$RUNNER_TEMP/shard.txt" > "$RUNNER_TEMP/part.txt"
          echo "shard $SHARD has $(grep -c . "$RUNNER_TEMP/shard.txt") mutants; part $PART of $PARTS has $(grep -c . "$RUNNER_TEMP/part.txt")"
          test "$(grep -c . "$RUNNER_TEMP/part.txt")" -gt 0

      - name: Run this part's mutants against the module's tests
        if: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard)) }}
        env:
          GLOB: ${{ matrix.glob }}
          FILTER: ${{ matrix.filter }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          re=$(python3 -I -c 'import re,sys; esc=lambda s: re.sub(r"([\\.+*?()|\[\]{}^$#&~-])", r"\\\1", s); print("^(" + "|".join(esc(l.rstrip(chr(10))) for l in sys.stdin) + ")$")' < "$RUNNER_TEMP/part.txt")
          expected=$(grep -c . "$RUNNER_TEMP/part.txt")
          listed=$(cargo mutants --package gorse-model --file "$GLOB" --re "$re" --list | grep -c . || true)
          if [ "$listed" != "$expected" ]; then
            echo "::error::the part's regex selects $listed mutants, but the part has $expected"
            exit 1
          fi
          status=0
          cargo mutants --package gorse-model --file "$GLOB" --re "$re" --output "$out" -- --lib "$FILTER" || status=$?
          echo "cargo-mutants exit=$status"
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac

      - name: Upload this part's outcomes
        if: ${{ always() && (inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0}:{1},', matrix.module, matrix.shard))) }}
        uses: actions/upload-artifact@v4
        with:
          name: first-pass-${{ matrix.module }}-${{ matrix.shard }}-part${{ matrix.part }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  survivors:
    name: re-run the survivors against the full lib suite
    needs: [first-pass, first-pass-split]
    if: ${{ always() && (inputs.only == '' || inputs.survivors_from != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Place the frappe dataset the full lib suite reads (D-327)
        # The second pass runs the whole lib suite, which includes the frappe baseline test.
        timeout-minutes: 15
        run: GORSE_DATASETS=frappe scripts/setup-datasets.sh

      - name: Download the first-pass outcomes
        if: ${{ inputs.survivors_from == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: first-pass-*
          path: ${{ runner.temp }}/first

      - name: Download the first-pass outcomes of the earlier runs
        # A survivor-only dispatch reads the artifacts of the runs named in survivors_from, so a
        # shard that ran in another dispatch (ctr 3/10 and ctr 5/10) is re-run here too.
        if: ${{ inputs.survivors_from != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.survivors_from }}
          SKIP: ${{ inputs.skip_artifacts }}
        run: |
          for r in ${RUNS//,/ }; do
            gh run download "$r" --repo "$GITHUB_REPOSITORY" --pattern 'first-pass-*' --dir "$RUNNER_TEMP/first/$r"
          done
          # Artifacts named in skip_artifacts are removed, so their outcomes are not re-run here.
          for a in ${SKIP//,/ }; do
            find "$RUNNER_TEMP/first" -mindepth 2 -type d -name "$a" -prune -exec rm -rf {} +
            echo "left out $a"
          done

      - name: Gather the first-pass outcomes and the survivors
        run: |
          count() { find "$RUNNER_TEMP/first" -name "$1" -exec cat {} + 2>/dev/null | grep -c . || true; }
          echo "first pass: caught=$(count caught.txt) missed=$(count missed.txt) timeout=$(count timeout.txt) unviable=$(count unviable.txt)"
          find "$RUNNER_TEMP/first" \( -name missed.txt -o -name timeout.txt \) -exec cat {} + 2>/dev/null | sort -u > "$RUNNER_TEMP/survivors.txt" || true
          echo "survivors to re-run: $(grep -c . "$RUNNER_TEMP/survivors.txt" || true)"

      - name: Re-run each survivor against the full lib suite
        run: |
          out="$RUNNER_TEMP/rerun"
          mkdir -p "$out"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            grep -F "$f:" "$RUNNER_TEMP/survivors.txt" > "$RUNNER_TEMP/s.txt"
            expected=$(grep -c . "$RUNNER_TEMP/s.txt")
            # --re matches the full list line (path, line, column and description), so this
            # anchored alternation selects exactly the survivors of this file.
            re=$(python3 -I -c 'import re,sys; esc=lambda s: re.sub(r"([\\.+*?()|\[\]{}^$#&~-])", r"\\\1", s); print("^(" + "|".join(esc(l.rstrip(chr(10))) for l in sys.stdin) + ")$")' < "$RUNNER_TEMP/s.txt")
            listed=$(cargo mutants --package gorse-model --file "$f" --re "$re" --list | grep -c . || true)
            if [ "$listed" != "$expected" ]; then
              echo "::error::$f: the re-run selects $listed mutants, but there are $expected survivors"
              exit 1
            fi
            status=0
            cargo mutants --package gorse-model --file "$f" --re "$re" --output "$out/$(echo "$f" | tr / _)" -- --lib || status=$?
            echo "$f: $expected survivors re-run against the full lib suite, cargo-mutants exit=$status"
            case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
          done < <(cut -d: -f1 "$RUNNER_TEMP/survivors.txt" | sort -u)
          caught=$(find "$out" -name caught.txt -exec cat {} + 2>/dev/null | grep -c . || true)
          missed=$(find "$out" -name missed.txt -exec cat {} + 2>/dev/null | grep -c . || true)
          timeouts=$(find "$out" -name timeout.txt -exec cat {} + 2>/dev/null | grep -c . || true)
          echo "full-suite re-run: caught=$caught missed=$missed timeout=$timeouts"
          if [ "$missed" != 0 ] || [ "$timeouts" != 0 ]; then
            find "$out" \( -name missed.txt -o -name timeout.txt \) -exec cat {} + 2>/dev/null
            exit 1
          fi

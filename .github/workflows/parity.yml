name: parity

# Runs the parity tier (G11 in porting/verification-plan.md): the frozen
# differential suites against the Go oracle built from commit 2e9c969
# (branch go-oracle-final). It runs per release and on demand, not per commit.
# The workflow holds no secrets and no credentials; the backend URIs come from
# scripts/backends.env and the containers from storage/docker-compose.yml.
#
# Each suite is its own step with a 45-minute limit, so a hang shows as the
# suite that is stuck. pinterest_20_bpr runs in a job of its own, with a 120-minute
# step (D-320). A failed or timed-out suite does not stop the next one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      head_only:
        description: "Run only the head-mode jobs (D-325), not the pinned suites"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  parity:
    name: parity suites against the Go oracle
    if: ${{ !inputs.head_only }}
    runs-on: ubuntu-24.04
    # A backstop for the whole job. The per-suite limits are the ones that apply.
    timeout-minutes: 360
    steps:
      - name: Check out the repository with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The oracle commit 2e9c969 is an ancestor of master, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false

      - name: Start the backends
        run: docker compose -f storage/docker-compose.yml up -d

      # Three suites read ml-100k and github dumps from /mnt/project-files/datasets,
      # a path the pinned tests hard-code (the pinned tree has no setting for it),
      # and the playground reads ml-100k from ~/.gorse/dataset. The script places the
      # dumps in the home folder; the hard-coded path gets copies. Its zip list is
      # cut to iris, the smallest, because the script fetches the zips first and
      # stops at a failed one. The suites' own loader fetches the other datasets.
      - name: Place the playground dumps the suites read
        continue-on-error: true
        timeout-minutes: 10
        run: |
          GORSE_DATASETS=iris GORSE_DUMPS="ml-100k.bin.gz github.bin.gz" scripts/setup-datasets.sh
          sudo mkdir -p /mnt/project-files/datasets
          sudo cp "$HOME/.gorse/dataset/ml-100k.bin.gz" "$HOME/.gorse/dataset/github.bin.gz" /mnt/project-files/datasets/

      - name: Build the Go oracle and extract the pinned tree
        id: build
        timeout-minutes: 45
        run: scripts/parity.sh build

      - name: "suite bench_golden"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run bench_golden

      - name: "suite cf_golden"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run cf_golden

      - name: "suite cli_oracle"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run cli_oracle

      - name: "suite ctr_replay"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run ctr_replay

      - name: "suite go_decode"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run go_decode

      - name: "suite go_printable"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run go_printable

      - name: "suite go_xmlname"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run go_xmlname

      - name: "suite item_to_item_oracle"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run item_to_item_oracle

      - name: "suite master_http_surface"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run master_http_surface

      # pinterest_20_bpr runs in the pinterest job, below. This step runs the other
      # metrics tests. Its 45-minute limit is about 1.65 times the 27.2 min the step
      # took without pinterest_20_bpr in run 42031247822 (job 127257963992, success).
      - name: "suite metrics"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run metrics:except=pinterest_20_bpr

      - name: "suite mixed_cli"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_cli

      - name: "suite mixed_cluster"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_cluster

      - name: "suite mixed_cmd"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_cmd

      - name: "suite mixed_master"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_master

      - name: "suite mixed_master_rest"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_master_rest

      - name: "suite mixed_server"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_server

      - name: "suite mixed_worker"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run mixed_worker

      - name: "suite monitor_empty_list"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run monitor_empty_list

      - name: "suite o91_probe"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run o91_probe

      - name: "suite playground"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run playground

      - name: "suite playground_restore"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run playground_restore

      - name: "suite proxy_wire"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run proxy_wire

      - name: "suite recommend_oracle"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run recommend_oracle

      - name: "suite recommend_tie_go"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run recommend_tie_go

      - name: "suite rest_golden"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run rest_golden

      - name: "suite schema"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run schema

      - name: "suite sdk"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run sdk

      - name: "suite server_http_surface"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run server_http_surface

      - name: "suite sparse_oracle"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run sparse_oracle

      - name: "suite vector_cross_read"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: scripts/parity.sh run vector_cross_read

  # pinterest_20_bpr in a job of its own (D-320), so the parity job's step limits
  # stay under its 360-minute cap. It takes the same backends and dumps as the parity job.
  pinterest:
    name: pinterest_20_bpr against the Go oracle
    if: ${{ !inputs.head_only }}
    runs-on: ubuntu-24.04
    # A backstop for the job. The step limit below is the one that applies.
    timeout-minutes: 180
    steps:
      - name: Check out the repository with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The oracle commit 2e9c969 is an ancestor of master, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false

      - name: Start the backends
        run: docker compose -f storage/docker-compose.yml up -d

      - name: Place the playground dumps the suites read
        continue-on-error: true
        timeout-minutes: 10
        run: |
          GORSE_DATASETS=iris GORSE_DUMPS="ml-100k.bin.gz github.bin.gz" scripts/setup-datasets.sh
          sudo mkdir -p /mnt/project-files/datasets
          sudo cp "$HOME/.gorse/dataset/ml-100k.bin.gz" "$HOME/.gorse/dataset/github.bin.gz" /mnt/project-files/datasets/

      # D-320: a debug run of pinterest_20_bpr alone took 85.1 min (run 42356303389, job
      # 128355030247). The limit is 120 min, the ceiling the President set. The build of
      # the Go oracle and the pinned tree runs inside this step, as in the suite steps.
      - name: "suite metrics pinterest_20_bpr"
        timeout-minutes: 120
        run: scripts/parity.sh run metrics:only=pinterest_20_bpr

  # The head run (D-325): the metrics suites against this checkout's crates, with the
  # Go oracle still built from 2e9c969. It is the same frozen suite, in an overlay of
  # the pinned tree (scripts/parity.sh, PARITY_TREE=head). It runs on release and on
  # dispatch with the parity job, and the result is recorded in PORTING.md.
  metrics-head:
    name: metrics suites against the head under test
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # D-368: the head overlay reads the derived references from this directory.
      PARITY_DERIVED_DIR: ${{ github.workspace }}/target/parity/derived
    steps:
      - name: Check out the repository with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The oracle commit 2e9c969 is an ancestor of master, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false

      - name: Start the backends
        run: docker compose -f storage/docker-compose.yml up -d

      - name: Place the playground dumps the suites read
        continue-on-error: true
        timeout-minutes: 10
        run: |
          GORSE_DATASETS=iris GORSE_DUMPS="ml-100k.bin.gz github.bin.gz" scripts/setup-datasets.sh
          sudo mkdir -p /mnt/project-files/datasets
          sudo cp "$HOME/.gorse/dataset/ml-100k.bin.gz" "$HOME/.gorse/dataset/github.bin.gz" /mnt/project-files/datasets/

      # D-368: the derived references. The pinned Go oracle fits three configurations with one
      # job, with its Evaluate patched in the derive copy only (scripts/go-evaluate-dedupe.patch),
      # on the original test and training files.
      - name: "head derive overrides (D-368)"
        timeout-minutes: 90
        run: PARITY_TREE=head scripts/parity.sh derive-overrides "$PARITY_DERIVED_DIR"

      # The first step compiles the metrics suite against the head, and the later steps
      # reuse that build. It also builds the Go oracle from 2e9c969.
      - name: "head compile metrics"
        id: compile
        timeout-minutes: 90
        run: PARITY_TREE=head scripts/parity.sh dry-run

      - name: "head suite metrics"
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 45
        run: PARITY_TREE=head scripts/parity.sh run metrics:except=pinterest_20_bpr

  # pinterest_20_bpr against the head, in a job of its own, as in the pinned tree (D-320).
  metrics-head-pinterest:
    name: pinterest_20_bpr against the head under test
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # D-368: the head overlay reads the derived references from this directory.
      PARITY_DERIVED_DIR: ${{ github.workspace }}/target/parity/derived
    steps:
      - name: Check out the repository with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start the backends
        run: docker compose -f storage/docker-compose.yml up -d

      - name: Place the playground dumps the suites read
        continue-on-error: true
        timeout-minutes: 10
        run: |
          GORSE_DATASETS=iris GORSE_DUMPS="ml-100k.bin.gz github.bin.gz" scripts/setup-datasets.sh
          sudo mkdir -p /mnt/project-files/datasets
          sudo cp "$HOME/.gorse/dataset/ml-100k.bin.gz" "$HOME/.gorse/dataset/github.bin.gz" /mnt/project-files/datasets/

      # D-368: the derived references, as in metrics-head above.
      - name: "head derive overrides (D-368)"
        timeout-minutes: 90
        run: PARITY_TREE=head scripts/parity.sh derive-overrides "$PARITY_DERIVED_DIR"

      - name: "head compile metrics"
        id: compile
        timeout-minutes: 90
        run: PARITY_TREE=head scripts/parity.sh dry-run

      # D-320: the head pinterest run took 116 min on the anchor (run 42499893186) and 120
      # min was too close, so this step gets 180 minutes (coordinator ruling, 2026-11-08).
      # The compile step above has its own limit.
      - name: "head suite metrics pinterest_20_bpr"
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 180
        run: PARITY_TREE=head scripts/parity.sh run metrics:only=pinterest_20_bpr

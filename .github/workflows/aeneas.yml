# The Aeneas spike of the verification plan (P1-3). Charon and Aeneas are fetched
# and built here, because the sandbox cannot reach the Lean hosts or the release
# downloads they need.
name: aeneas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the runs still going for the previous push.
# Runs for pushes to a branch, and manual runs, always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover the Charon and Aeneas revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Print the current revisions and the toolchain pins
        run: scripts/aeneas-spike.sh discover

  # The spike runs in three stages, each a step of its own, so the step list shows
  # which stage failed. Each stage tees its output to a file; the last step reports
  # the tail of every stage that ran, in the job summary and as an error annotation.
  spike:
    name: Spike, in the charon, aeneas and lean stages
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # The runner context is not available in a job's env, so the work directory
      # is a fixed path. The stages run on one runner, so they share it.
      SPIKE_WORK: /tmp/aeneas-spike
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The hosted runner has about 14 GB free. The spike adds an OCaml switch, a
      # Rust nightly with rustc-dev, and the Mathlib cache, and the last run's
      # job was cut off without finishing its step. These preinstalled trees are
      # not used here, so removing them frees room for the spike.
      - name: Free runner disk space the spike needs
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h /

      - name: Install OPAM and the C libraries the OCaml dependencies need
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config m4 build-essential

      - name: Install elan, the Lean toolchain manager
        run: |
          curl -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          # The same installer digest as proofs.yml, checked before the installer runs.
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: "Stage charon: fetch the pins and build Charon"
        shell: bash
        run: scripts/aeneas-spike.sh charon 2>&1 | tee "$RUNNER_TEMP/aeneas-charon.log"

      - name: "Stage aeneas: build Aeneas and translate the spike crates"
        shell: bash
        run: scripts/aeneas-spike.sh aeneas 2>&1 | tee "$RUNNER_TEMP/aeneas-aeneas.log"

      - name: "Stage lean: fetch the Mathlib cache and build the generated Lean"
        shell: bash
        run: scripts/aeneas-spike.sh lean 2>&1 | tee "$RUNNER_TEMP/aeneas-lean.log"

      - name: Report the tail of each stage's log when a stage failed
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/aeneas-charon.log "$RUNNER_TEMP"/aeneas-aeneas.log "$RUNNER_TEMP"/aeneas-lean.log; do
            [ -s "$f" ] || continue
            stage="$(basename "$f" .log)"
            {
              echo "## $stage: last 100 lines"
              echo '```'
              tail -n 100 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # An annotation message is one line for the runner: escape %, CR and LF.
            msg="$(tail -n 20 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=$stage failed::$msg"
          done

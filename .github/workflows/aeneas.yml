# The Aeneas spike of the verification plan (P1-3). Charon and Aeneas are fetched
# and run here, because the sandbox cannot reach the Lean hosts or the release
# downloads they need.
name: aeneas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover the Charon and Aeneas revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Print the current revisions and the toolchain pins
        run: scripts/aeneas-spike.sh discover

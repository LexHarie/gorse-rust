# D-372: a one-off profile of the nanoda leg of G2 on the exports of an earlier run.
# It runs only when dispatched, and never on a pull request, so it cannot start the
# nanoda check of proofs.yml. The exports are downloaded from the g2-exports artifact.
name: nanoda-profile

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Run id whose g2-exports artifact is profiled"
        required: true
        default: "42746817355"
        type: string
      minutes:
        description: "Budget of the profiled check, in minutes"
        required: true
        default: "85"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  profile:
    name: Profile nanoda on the G2 exports (D-372)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the exports of G2
        uses: actions/download-artifact@v4
        with:
          name: g2-exports
          path: ${{ runner.temp }}/g2
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run nanoda with per-declaration timing
        run: scripts/profile-nanoda.sh "$RUNNER_TEMP/g2" "${{ inputs.minutes }}"

      - name: Keep the profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nanoda-profile
          path: ${{ runner.temp }}/g2/profile*
          retention-days: 14

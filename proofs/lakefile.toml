# The Lean project of the verification plan (P1-2). The toolchain is pinned in
# lean-toolchain, and Mathlib is pinned to the tag of the same release. The
# resolved revision and the manifest are recorded in lake-manifest.json.
name = "gorse_proofs"
version = "0.1.0"
defaultTargets = ["Gorse"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.15.0"

[[lean_lib]]
name = "Gorse"

# The G9 oracle for the T1 metrics (D-326). Built by `lake build oracle`, not by the
# default target, and run by scripts/check-oracle.sh.
[[lean_exe]]
name = "oracle"
root = "Oracle.Main"

# The G9 oracle for the top-k filter (D-335). Built by `lake build oracle_topk`, and run by
# scripts/check-oracle-topk.sh. It imports Gorse.Oracle.TopKMirror, which is Lean's core
# library only, so the build does not compile Mathlib.
[[lean_exe]]
name = "oracle_topk"
root = "Oracle.TopK"

# The G9 oracle for the dot kernels (D-349, P4-7). Built by `lake build oracle_dot`, and run by
# scripts/check-oracle-dot.sh (P4-7d). It imports Gorse.Spec.DotRat, so it builds Mathlib from the
# cache, as the g1 job does. The trust listing of the executable is run by `lake env lean ../scripts/dot-trust.lean`.
[[lean_exe]]
name = "oracle_dot"
root = "Oracle.Dot"

# The G9 oracle for `map` (D-352, P4-9). Built by `lake build oracle_map`, and run by
# scripts/check-oracle-map.sh. It imports Gorse.Spec.MapRat, which imports Float32Q and so builds
# Mathlib from the cache, as oracle_dot does.
[[lean_exe]]
name = "oracle_map"
root = "Oracle.Map"

# The G9 oracle for the ndcg log table (D-354, P4-10). Built by `lake build oracle_log2`, and run by
# scripts/check-oracle-log2.sh. It imports Lean's core library only, so the build does not compile
# Mathlib.
[[lean_exe]]
name = "oracle_log2"
root = "Oracle.Log2"

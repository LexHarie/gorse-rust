# The Lean project of the verification plan (P1-2). The toolchain is pinned in
# lean-toolchain, and Mathlib is pinned to the tag of the same release. The
# resolved revision and the manifest are recorded in lake-manifest.json.
name = "gorse_proofs"
version = "0.1.0"
defaultTargets = ["Gorse"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.15.0"

[[lean_lib]]
name = "Gorse"

# The G9 oracle for the T1 metrics (D-326). Built by `lake build oracle`, not by the
# default target, and run by scripts/check-oracle.sh.
[[lean_exe]]
name = "oracle"
root = "Oracle.Main"

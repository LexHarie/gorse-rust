# Rust port of Gorse. The Go implementation in this repository (pinned in
# PORTING.md) is the reference oracle; see PORTING.md before changing anything.
[workspace]
resolver = "3"
members = ["crates/*", "conformance"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/LexHarie/gorse-rust"

[workspace.dependencies]
# Internal crates.
gorse-protocol = { path = "crates/gorse-protocol" }
gorse-common = { path = "crates/gorse-common" }
gorse-storage-core = { path = "crates/gorse-storage-core" }
gorse-config = { path = "crates/gorse-config" }
gorse-model-core = { path = "crates/gorse-model-core" }
gorse-storage = { path = "crates/gorse-storage" }
gorse-dataset = { path = "crates/gorse-dataset" }
gorse-model = { path = "crates/gorse-model" }
gorse-logics = { path = "crates/gorse-logics" }
gorse-worker = { path = "crates/gorse-worker" }
gorse-server = { path = "crates/gorse-server" }
gorse-master = { path = "crates/gorse-master" }
gorse-cmd = { path = "crates/gorse-cmd" }

# External crates, chosen in porting/crate-selection.md. A crate is listed here
# only once a work package uses it.
blake2 = "0.11.0"
cc = "1.8.0"
hex = "0.4.3"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

[workspace.lints.rust]
# `unsafe` is allowed only at FFI/SIMD boundaries, opted into per module with a
# justification, and every block needs a `// SAFETY:` comment (clippy below).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
